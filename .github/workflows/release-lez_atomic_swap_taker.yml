name: Release lez_atomic_swap_taker

# Written by hand from release-module.yml.template: the module lives in a
# subdirectory of the lez-atomic-swaps submodule (a multi-module repository),
# so module_path points below the submodule root.

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: "Force build — replace the current published release if it has the same version."
        type: boolean
        default: false

# Forked repos default to a read-only GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    uses: ./.github/workflows/_release-module.yml
    with:
      module_path: submodules/lez-atomic-swaps/apps/basecamp/taker
      force_build: ${{ inputs.force_build }}
    secrets: inherit
